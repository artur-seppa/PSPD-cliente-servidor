<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumidor gRPC via REST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Interface Web para Serviços gRPC</h1>
        
        <!-- Formulário para ConsultarUsuario -->
        <div class="card">
            <h2>Consultar Usuário</h2>
            <input type="text" id="usuarioId" placeholder="ID do usuário">
            <button onclick="consultarUsuario()">Consultar</button>
            <div id="resultadoUsuario" class="resultado"></div>
        </div>

        <!-- Formulário para CalcularEstatisticas -->
        <div class="card">
            <h2>Calcular Estatísticas</h2>
            <input type="text" id="numeros" placeholder="Números (ex: 1,2,3)">
            <button onclick="calcularEstatisticas()">Calcular</button>
            <div id="resultadoEstatisticas" class="resultado"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
